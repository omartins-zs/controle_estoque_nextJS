services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: estoque_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: 1
    expose:
      - "3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - estoque_network

  nginx:
    image: nginx:1.27-alpine
    container_name: estoque_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - estoque_network

  mysql:
    image: mysql:8.0
    container_name: estoque_mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-controle_estoque}
      MYSQL_USER: ${DB_USERNAME:-estoque_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-estoque_secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_secret}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - estoque_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: estoque_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8085:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - estoque_network

volumes:
  mysql_data:
    driver: local

networks:
  estoque_network:
    driver: bridge
